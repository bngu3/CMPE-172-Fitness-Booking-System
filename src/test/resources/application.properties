# Tests use a separate database and reset it on startup; never point this at booking_app.
spring.datasource.url=${BOOKING_TEST_DB_URL:jdbc:postgresql://localhost:5432/booking_app_test}
spring.datasource.username=${BOOKING_TEST_DB_USERNAME:postgres}
spring.datasource.password=${BOOKING_TEST_DB_PASSWORD:pass123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-reset-schema.sql,classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
server.port=0
