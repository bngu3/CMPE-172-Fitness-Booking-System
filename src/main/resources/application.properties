# ---- Server ----
server.port=8080

# ---- PostgreSQL connection (JDBC, no ORM) ----
# Update the database name / username / password to match your local Postgres setup
spring.datasource.url=jdbc:postgresql://localhost:5432/booking_app
spring.datasource.username=postgres
spring.datasource.password=pass123
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Idempotent schema setup; seed.sql is applied manually once on a new database ----
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema.sql
