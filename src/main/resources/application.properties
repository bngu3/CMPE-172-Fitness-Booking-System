# ---- Server ----
server.port=8080

# ---- PostgreSQL connection (JDBC, no ORM) ----
# Update the database name / username / password to match your local Postgres setup
spring.datasource.url=jdbc:postgresql://localhost:5432/booking_app
spring.datasource.username=postgres
spring.datasource.password=pass123
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Auto-run schema.sql and seed.sql on every startup ----
# "always" is required because Postgres is an external DB (Spring Boot only
# auto-runs these by default for embedded DBs like H2)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql