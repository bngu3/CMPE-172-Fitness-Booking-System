name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booking_app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify
        env:
          BOOKING_TEST_DB_URL: jdbc:postgresql://localhost:5432/booking_app_test
          BOOKING_TEST_DB_USERNAME: postgres
          BOOKING_TEST_DB_PASSWORD: pass123
